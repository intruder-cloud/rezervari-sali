<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR pentru rezervări</title>
<style>body{font:16px system-ui;background:#f3f5ef;color:#20271e;max-width:560px;margin:40px auto;padding:20px}.box{background:white;border-radius:16px;padding:24px;box-shadow:0 8px 30px #0001}input{width:100%;padding:12px;border:1px solid #ccd2c5;border-radius:8px;font:inherit}button{margin-top:12px;background:#315fbd;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700}#qr{margin:24px auto;text-align:center}</style>
<div class="box"><h1>QR pentru rezervarea sălilor</h1><p>Introdu adresa publică a site-ului tău Render:</p><input id="url" placeholder="https://numele-tau.onrender.com"><button onclick="makeQR()">Generează QR</button><div id="qr"></div><p><small>Scanează codul cu telefonul pentru a verifica dacă deschide site-ul corect.</small></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>function makeQR(){const u=document.getElementById('url').value.trim();if(!/^https:\/\/.+/.test(u)){alert('Introdu un link HTTPS valid.');return}const q=document.getElementById('qr');q.innerHTML='';new QRCode(q,{text:u,width:240,height:240,correctLevel:QRCode.CorrectLevel.H});}</script>
</html>
